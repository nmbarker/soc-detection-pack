title: Shadow Copy Or Backup Recovery Deletion
id: f588a779-6cb2-4e18-8984-0643839e59b3
status: experimental
description: >
  Detects commands that delete Volume Shadow Copies, the backup catalog, or disable Windows recovery.
  Ransomware operators run these before encryption to block restore.
references:
  - https://attack.mitre.org/techniques/T1490/
author: Big Dipper
date: 2026-11-16
tags:
  - attack.impact
  - attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  selection_vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  selection_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
      - 'shadowcopy'
      - 'delete'
  selection_wbadmin:
    Image|endswith: '\wbadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'catalog'
  selection_bcdedit:
    Image|endswith: '\bcdedit.exe'
    CommandLine|contains|all:
      - 'recoveryenabled'
      - 'no'
  condition: 1 of selection_*
falsepositives:
  - Backup software or disk-cleanup scripts that prune shadow copies
  - Imaging / lab rebuild procedures
level: high
