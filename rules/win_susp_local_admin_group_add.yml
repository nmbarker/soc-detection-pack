title: Account Added To Local Administrators Group Via Command Line
id: 16e70882-bb95-492e-9a07-afb64ae1a5f5
status: experimental
description: >
  Detects net.exe / net1.exe or PowerShell adding an account to the local Administrators group.
  Attackers use this to retain or escalate privilege on a host.
references:
  - https://attack.mitre.org/techniques/T1098/
author: Big Dipper
date: 2026-11-16
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098
logsource:
  category: process_creation
  product: windows
detection:
  selection_net:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
    CommandLine|contains|all:
      - 'localgroup'
      - 'administrators'
      - '/add'
  selection_ps:
    CommandLine|contains|all:
      - 'Add-LocalGroupMember'
      - 'Administrators'
  condition: 1 of selection_*
falsepositives:
  - Helpdesk or provisioning scripts that grant local admin
  - Device build / imaging automation
level: medium
